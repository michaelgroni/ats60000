name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten und Tests
        run: |
          pip install pyinstaller
          python -m unittest discover -s tests
      - name: EXE bauen
        run: pyinstaller ats-mini-remote.spec
      - name: EXE mit Versionsnummer benennen
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Move-Item "dist/ATS-Mini-Remote.exe" "dist/ATS-Mini-Remote-$version.exe"
      - name: Release anlegen und EXE anhaengen
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" --verify-tag --title "ATS-Mini WLAN-Fernbedienung ${{ github.ref_name }}" --notes "WLAN-Fernbedienung fuer das ATS-Miniradio V1 (ESP32-S3/SI4732). Einzelne EXE fuer Windows - einfach starten, kein Python noetig." "dist/ATS-Mini-Remote-$version.exe"
        env:
          GH_TOKEN: ${{ github.token }}
